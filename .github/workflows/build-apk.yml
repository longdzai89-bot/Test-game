name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional

      - name: Fix Rollup Linux native dependency
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --include=optional "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"

      - name: Build web
        run: npm run build --workspace web

      - name: Add Android platform
        run: cd apk && npx cap add android || true

      - name: Sync Capacitor
        run: cd apk && npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: cd apk/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tutien-debug-apk
          path: apk/android/app/build/outputs/apk/debug/*.apk
